name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    name: Simulator, lab and server (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch keeps it quick)
        run: |
          pip install swig
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - run: pytest -q

  browser:
    name: Browser simulator matches (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund planck@1.5.0
      - run: node --test tests/js/*.test.mjs
